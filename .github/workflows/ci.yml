name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    name: Compile firmware for ESP32
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: arduino-cli lib install "Adafruit PWM Servo Driver Library"

      # arduino-cli requires the sketch folder name to match the .ino file name.
      - name: Stage sketch
        run: |
          mkdir -p build/RobotGripper
          cp firmware/RobotGripper.ino build/RobotGripper/

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all build/RobotGripper
